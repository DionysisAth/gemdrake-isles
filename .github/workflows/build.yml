name: Build apps

# Builds the Android APK and an unsigned iOS IPA, then publishes both on a
# GitHub Release so they can be downloaded directly.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk gemdrake-isles.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: gemdrake-isles.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # No Apple signing certificate is configured, so this IPA is unsigned.
      # Sideload it with a tool that re-signs (e.g. Sideloadly/AltStore), or
      # add signing secrets and use `flutter build ipa` for TestFlight.
      - run: flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry gemdrake-isles-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: gemdrake-isles-unsigned.ipa

  release:
    needs: [android, ios]
    # Publish the APK even if the iOS build fails.
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="build-${{ github.run_number }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Gemdrake Isles build ${{ github.run_number }}" \
            --notes "Automated build of ${{ github.ref_name }} @ ${{ github.sha }}.

          - **gemdrake-isles.apk**: Android. Install directly (allow installs from unknown sources).
          - **gemdrake-isles-unsigned.ipa**: iOS, unsigned. Needs re-signing to install (e.g. Sideloadly/AltStore) or an Apple Developer account for TestFlight."
