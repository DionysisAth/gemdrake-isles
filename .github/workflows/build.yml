name: Build apps

# Builds the Android APK and an unsigned iOS IPA, then publishes both on a
# GitHub Release so they can be downloaded directly.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Signs with your upload key when the ANDROID_KEYSTORE_* secrets are
      # set (see README); otherwise with the debug key, for testing only.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: using the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk gemdrake-isles.apk
      # The .aab is what Google Play wants for uploads.
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/bundle/release/app-release.aab gemdrake-isles.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: gemdrake-isles.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: gemdrake-isles.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # No Apple signing certificate is configured, so this IPA is unsigned.
      # Sideload it with a tool that re-signs (e.g. Sideloadly/AltStore), or
      # add signing secrets and use `flutter build ipa` for TestFlight.
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry gemdrake-isles-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: gemdrake-isles-unsigned.ipa

  # Installs the APK on an emulator and fails if the app doesn't stay up,
  # so a build that crashes on launch is never published.
  android-launch-test:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          # Software rendering inside the guest: the host renderer
          # (swiftshader_indirect) crashed the emulator once real ad
          # content started loading.
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android_launch_test.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-test
          path: |
            logcat.txt
            logcat_live.txt
            crash.txt
            screen.png
            /tmp/android-runner/

  # Uploads the signed bundle from main to Play Console's internal testing
  # track as a draft release. Runs only once the PLAY_SERVICE_ACCOUNT_JSON
  # and ANDROID_KEYSTORE_* secrets are set (see README).
  play-upload:
    needs: [android, android-launch-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.PLAY_KEY != '' && env.SIGNED == 'true'
      - uses: actions/download-artifact@v4
        if: env.PLAY_KEY != '' && env.SIGNED == 'true'
        with:
          name: android-aab
      - name: Upload to the internal testing track
        if: env.PLAY_KEY != '' && env.SIGNED == 'true'
        run: |
          pip install google-auth requests
          echo "$PLAY_KEY" > play-key.json
          python3 tool/play/upload.py --key play-key.json \
            --bundle gemdrake-isles.aab --track internal \
            --notes "Build ${{ github.run_number }}"
          rm play-key.json

  release:
    needs: [android, android-launch-test, ios]
    # Publish even if the iOS build fails, but never an APK that crashes.
    if: always() && needs.android.result == 'success' && needs.android-launch-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*-{apk,aab,ipa}'
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="build-${{ github.run_number }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Gemdrake Isles build ${{ github.run_number }}" \
            --notes "Automated build of ${{ github.ref_name }} @ ${{ github.sha }}.

          - **gemdrake-isles.apk**: Android. Install directly (allow installs from unknown sources).
          - **gemdrake-isles.aab**: Android App Bundle, for uploading to Google Play Console.
          - **gemdrake-isles-unsigned.ipa**: iOS, unsigned. Needs re-signing to install (e.g. Sideloadly/AltStore) or an Apple Developer account for TestFlight."
