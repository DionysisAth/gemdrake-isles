name: Build apps

# Builds the Android APK and an unsigned iOS IPA, then publishes both on a
# GitHub Release so they can be downloaded directly.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk gemdrake-isles.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: gemdrake-isles.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # No Apple signing certificate is configured, so this IPA is unsigned.
      # Sideload it with a tool that re-signs (e.g. Sideloadly/AltStore), or
      # add signing secrets and use `flutter build ipa` for TestFlight.
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry gemdrake-isles-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: gemdrake-isles-unsigned.ipa

  # Installs the APK on an emulator and fails if the app doesn't stay up,
  # so a build that crashes on launch is never published.
  android-launch-test:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/android_launch_test.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-launch-test
          path: |
            logcat.txt
            crash.txt
            screen.png

  release:
    needs: [android, android-launch-test, ios]
    # Publish even if the iOS build fails, but never an APK that crashes.
    if: always() && needs.android.result == 'success' && needs.android-launch-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '*-{apk,ipa}'
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          tag="build-${{ github.run_number }}"
          gh release create "$tag" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Gemdrake Isles build ${{ github.run_number }}" \
            --notes "Automated build of ${{ github.ref_name }} @ ${{ github.sha }}.

          - **gemdrake-isles.apk**: Android. Install directly (allow installs from unknown sources).
          - **gemdrake-isles-unsigned.ipa**: iOS, unsigned. Needs re-signing to install (e.g. Sideloadly/AltStore) or an Apple Developer account for TestFlight."
